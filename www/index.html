<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miva · Tu precio justo</title>
<style>
:root{--navy:#0b2447;--green:#16a34a;--bg:#f3f6fa;--line:#d6dfeb;--mut:#5b6b80;--ink:#10243f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);padding:18px 16px 14px;text-align:center;color:#fff}
.logo{display:inline-flex;align-items:flex-end;font:800 38px/1 system-ui,sans-serif;letter-spacing:-1px}
.logo svg{width:30px;height:30px;margin:0 1px 3px}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{max-width:520px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 6px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid #86efac;border-color:var(--green)}
.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:8px}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.big{background:var(--navy);padding:18px;text-align:left}
.btn.big small{display:block;font-weight:400;opacity:.8;font-size:14px}
.nav{display:flex;gap:10px}.nav .btn{margin-top:14px}
.bar{height:6px;background:var(--line);border-radius:9px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.tip{background:#ecfdf3;border-radius:10px;padding:10px 12px;color:#14532d;font-size:14px;margin-top:12px}
.price{font-size:44px;font-weight:800;color:var(--navy);margin:4px 0}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.frase{font-size:20px;font-weight:700;text-align:center;color:var(--green);margin:14px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:none;font-size:20px;color:var(--mut);cursor:pointer}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;margin-top:14px;font:inherit}
small.f{display:block;text-align:center;color:var(--mut);margin-top:16px}

textarea{width:100%;min-height:110px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px}
#notice{position:fixed;bottom:16px;left:5%;width:90%;background:#10243f;color:white;padding:14px;border-radius:12px;display:none;z-index:20}
.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .btn{font-size:15px}.brand{width:210px;height:110px;object-fit:cover;max-width:80%;display:block;margin:auto}
header{background:#161a35}.line{gap:12px}.btn.danger{background:#b91c1c}main{padding-bottom:calc(85px + var(--ad-space,0px))}#notice{bottom:calc(16px + var(--ad-space,0px))}input,select{min-width:0} .row{grid-template-columns:2fr 1fr 1fr}.mut{font-size:14px;color:var(--mut)}
</style></head><body>
<header>
<img class="brand" src="assets/logo.jpeg" alt="Miva · Tu precio justo"></header>
<main id="app"></main>
<div id="notice" role="status" aria-live="polite"></div>
<script src="assets/capacitor.js"></script>
<script src="config.js"></script>
<script src="ads.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body></html>
